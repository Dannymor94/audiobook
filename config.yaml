# Всё, что влияет на звук, — здесь. Хеш чанка = sha1(text + модель + seed +
# temperature + language + хеш файла латентов + переозвучка из text/pronounce.yaml,
# если сработала на этом чанке). Ударения-фиксы правятся в pronounce.yaml, не тут.
model:
  name: qwen3_tts                 # Qwen3-TTS-12Hz-<variant>-Base (Apache 2.0)
  # 1.7B выбрана на слух (ch13, test_5min): живее и чище 0.6B. Латенты свои на
  # каждую модель: ref/ref1.latents_1.7b.pt. Смена variant = весь кеш заново.
  # RAM ~11.6 GB на воркер → synth --workers не больше 2.
  variant: 1.7B
  # int8 = dynamic-квантизация Linear (только cpu), эксперимент для ускорения
  # рендера; звук проверяется на golden set G03. В хеш входит только при int8
  # (model id → "...-int8"); при none хеши не меняются.
  quantize: none
  language: ru
  seed: 42                        # база; фактический seed чанка = seed_for_chunk(hash)
  temperature: 1.0               # выбрано на слух: плавнее интонация; цена ~2x RTF из-за разгонов
  # Qwen тоже обрезает хвост чанка без sentinel. Дописывается только к чанкам без
  # финальной пунктуации (589 из 5127). Текст на . ! ? … : ; » сам даёт стоп-сигнал.
  # Не входит в хеш чанка.
  sentinel: " ."
  # ё сохраняется (Qwen читает ё верно); ударения "+" не используются (ломают Qwen).
reference:
  # Отрывок живой записи главы 1 (25:26, ~23 с), выбран на слух: теплее и
  # неторопливее ref1 (ch13 ref-compare, scout_2526c). Срез по настоящей паузе
  # (ref-scout snap_to_silence) — прежний срез впритык давал акцент.
  path: ref/ref_ch1.wav
  # Дословная расшифровка, проверена на слух. Полный клон (ICL).
  # Латенты: ref/ref_ch1.latents_1.7b.pt (хеш файла входит в хеш каждого чанка).
  # Смена референса = весь кеш заново. Прежний: ref/ref1.wav (+ ref1.txt).
  ref_text_path: ref/ref_ch1.txt
render:
  # Потоков torch на воркер. Пусто = число логических ядер / число воркеров.
  # Подбирается `./run.sh bench --workers 2 --threads N`. В хеш не входит.
  cpu_threads:
  # Для ./run.sh status: эффективный RTF всей машины (2 воркера) — оценка остатка.
  eta_rtf: 6.5
  # Секции, которые не озвучиваем (status их не считает). Решение за человеком.
  skip_sections: []
  # Per-chunk length cap. Qwen open-end generation can run away (never emit a
  # stop); identical (text, seed) even renders differently in-process vs the
  # spawn worker, so a runaway cannot be tuned away by seed. Instead cap the
  # codec-token budget by chunk length: a runaway then saturates the budget in
  # seconds and is retried with the next seed, cheaply. audio_ms =
  # (base_ms + chars·ms_per_char)·margin, tokens = audio_ms·12/1000 (12 Hz codec).
  # Kept generously above real speech so a legit chunk is never truncated.
  cap_base_ms: 3000        # fixed per-chunk overhead (silence + sentinel)
  cap_ms_per_char: 100     # generous ceiling; real Russian speech is ~60–80
  cap_margin: 1.5
  # A runaway recurs on the same deterministic seed, so a capped generation
  # retries with derived alternate seeds (base+1, base+2, …) up to this many
  # times. Each retry is cheap now (cap, not timeout), so keep a deep budget.
  timeout_retries: 6
  # Last-resort wall-clock guard only. The length cap ends runaways first; this
  # catches a true hang (no tokens at all). Must exceed the time to generate the
  # full cap budget: at RTF ~8x, a 250-char chunk cap (~432 tokens, ~36s audio)
  # takes ~288s to generate. Set to 600 so the cap always fires before the
  # timeout kills and respawns the worker.
  chunk_timeout_s: 600
  # Context lead-in for short chunks (headings, one-word quoted inserts like «Я»):
  # too little text lets the voice-clone timbre drift mid-utterance. Prepend this
  # neutral carrier, synthesize the padded text, then cut the carrier off at the
  # first own-word boundary via whisper word timestamps (see leadin.py). Validated
  # by ear on ch13 (context-padding experiment, variant c). Enters the chunk hash
  # ONLY for chunks with len(text) <= max_chars, so it re-queues exactly the short
  # chunks and leaves every other chunk's cache. max_chars=55 covers ch13's short
  # quoted inserts (0015/0018/0022, 28-43 ch.) and every heading incl. the chapter
  # title 0001 (51 ch.); the longest heading in the section is 51. Set to null to
  # disable. Confirm the carrier by ear before changing it — it conditions timbre.
  leadin:
    phrase: "Вот что важно понять."
    max_chars: 55
# Длина чанка. 1.7B на длинных чанках сыпется по словам; 180 подтверждено на слух.
chunking:
  target: 180
  cap: 180
  min_len: 40
# Что подаётся модели (книжный текст и манифест не меняются; входит в хеш через
# переозвучку). Кавычки неслышимы и давали акцент на коротких цитатах; без
# финальной точки короткая фраза разваливалась. Подтверждено на слух (quote_test c).
text_prep:
  strip_quotes: true
  ensure_terminal: true
  # Пропущенная ё — по написанию самой книги (ребенок→ребёнок, если «ребёнок»
  # встречается не реже). Омографы (все/всё, чем/чём, берет/берёт) не трогаются.
  # Только вход модели; меняет хеш только затронутых чанков.
  yo_restore: true
pauses_ms:
  sentence: 350
  paragraph: 900
  chapter: 2000
  crossfade: 0
  # 0 = чанк с перечислением читается целиком, как в одобренном test_5min.
  # 250 = резать перечисление на фрагменты с паузой (на 1.7B на слух не проверено).
  enum_pause_ms: 0
  # Заголовок "Глава N. Метка: Название" делится на части со своими паузами
  # (после названия — пауза по уровню заголовка). Без ключей — заголовок целиком.
  # Паузы не входят в хеш: менять можно без пересинтеза (chunk + assemble).
  # ch13: «название главы нужно отдельно» — паузы увеличены.
  heading_number: 1200
  heading_colon: 700
  heading_level: {1: 2000, 2: 1200}
  # Пауза между фразами внутри абзаца — по знаку в конце фразы (иначе sentence).
  # Пусто = как раньше. Без перерендера: chunk --section + assemble + master.
  by_end: {"?": 550, "!": 500, "…": 700, ":": 450, ";": 450}   # проба, решается на слух (G11)
  # Свои паузы для отдельных секций (медитации/практики медленнее), напр.:
  # sections: {"22_praktika_...": {sentence: 600, paragraph: 1500}}
  sections: {}
  # "Шаг третий. …" в начале абзаца: метка шага — отдельным чанком с паузой.
  step_label: 800
qc:
  whisper_model: small           # models/whisper/small
  cer_threshold: 0.05
  # Слова, в которых whisper не уверен (p ниже порога), попадают в suspects —
  # список мест для прослушки. Ударение whisper не слышит; это ловит искажения.
  word_conf: 0.6
  max_retries: 3
  # Лучший из N дублей (qc сам рендерит и выбирает по whisper; в хеш не входит,
  # кеш не сбрасывается). short_chars — короткие чанки (заголовки, «Шаг N.»)
  # всегда в N дублях; low_conf — чанк, где слово длиннее 4 букв распознано с
  # уверенностью ниже порога («тебья»), тоже. Все дубли лежат в takes/, ничего не удаляется.
  takes:
    count: 3
    short_chars: 25          # ≤25: заголовки, «Шаг N.»; +14% времени рендера книги (40 было бы +28%)
    low_conf: 0.15
master:
  lufs: -19
  true_peak: -3
  highpass_hz: 80
  sample_rate: 44100
  # Тишина в начале/конце файла главы (плееры склеивают файлы; стандарт 1–5 с).
  head_ms: 1000
  tail_ms: 2000
  # eq3: +3 dB presence at 4 kHz, -2 dB mud cut at 300 Hz, light de-esser.
  # Chosen by ear from clarity_test/ variants.
  eq_filters: "equalizer=f=4000:t=q:w=1:g=3,equalizer=f=300:t=q:w=1:g=-2,deesser=i=0.15"
# Теги mp3 глав (название книги, автор, чтец, обложка). Пустое — не пишется.
book:
  title: "Ты не поломан"
  author: "Александр Исаев"
  narrator: ""        # что писать в «Читает: …» — решает человек
  cover: ""           # путь к jpg/png внутри проекта
# Вступление/концовка книги (тексты даёт автор; пустое — трек не делается).
credits:
  opening: ""   # текст вступления: название, автор, кто читает
  closing: ""   # текст концовки
  music: ""     # путь к файлу музыки (опционально), тихо под текстом, только в credits
  music_db: -24
