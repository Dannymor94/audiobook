name: ci
on: [push, pull_request]
jobs:
  test:
    # Render target is Linux (rented GPU box); Windows/macOS runners only burn
    # private-repo minutes (macOS bills 10x). Portability is still enforced in
    # code by tests/test_portability.py, not by the runner OS.
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv python install 3.11
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --extra dev
      - run: uv run python -m audiobook doctor --no-models
      - run: uv run pytest -m "not slow" -q
      - name: Pinned Silero Stress integration (public fixture only)
        run: |
          uv pip install --no-deps --require-hashes --only-binary :all: -r requirements/stress-audit.txt
          uv run --no-sync python scripts/smoke_stress_audit.py
