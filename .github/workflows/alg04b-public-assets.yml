name: ALG-04B public asset smoke
# One-shot research job: only changes to this file on the research branch.
# Public weights are hashed, never imported, synthesized, cached or uploaded.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/alg04b-public-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-assets:
    if: (github.event_name == 'pull_request' && github.head_ref == 'task/stress-map-r1' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/task/stress-map-r1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '0'
      HF_HUB_DISABLE_XET: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Gate one-shot smoke to explicitly named commit or manual dispatch
        id: gate
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$(git log -1 --format=%s)" = 'ci(ALG-04B): public asset smoke via PR' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.gate.outputs.run == 'true'
        with:
          enable-cache: false
      - run: uv python install 3.11
        if: steps.gate.outputs.run == 'true'
      - name: Verify real publisher metadata and public asset bytes
        if: steps.gate.outputs.run == 'true'
        run: |
          uv run --no-project --python 3.11 --with huggingface_hub==1.33.0 python -m audiobook.silero_openvoice_provision --out "$RUNNER_TEMP/alg04b-public"
          python -m json.tool "$RUNNER_TEMP/alg04b-public/inventory.json"
          python -m json.tool "$RUNNER_TEMP/alg04b-public/publisher.json"
