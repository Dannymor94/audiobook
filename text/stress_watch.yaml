# Слова-ловушки для `./run.sh probe`: омографы и слова, в которых TTS часто
# ставит ударение не туда. Probe находит в книге чанки с этими словами и
# озвучивает подборку для прослушки — ДО рендера книги.
#
# Это список «что проверить», не исправления. Исправления — в pronounce.yaml,
# каждое подтверждается на слух (pron-test). Список можно дополнять: одно слово
# в нижнем регистре на строку, как оно встречается в тексте (без ударений).
# Частоты в книге указаны на момент составления.

homographs:
  - потом       # 120 — пОтом / потОм
  - слова       # 29  — слОва / словА
  - руки        # 28  — рУки / рукИ
  - голоса      # 27  — гОлоса / голосА («родительские голоса»)
  - дыши        # 24  — дышИ (повелит.), модель может сказать дЫши
  - стоит       # 20  — стОит / стоИт
  - души        # 12  — дУши / душИ
  - сорок       # 12  — сОрок / сорОк
  - ветви       # 12  — вЕтви / ветвИ
  - понял       # 10  — пОнял (норма), частая ошибка понЯл
  - дома        # 10  — дОма / домА
  - начала      # 7   — нАчала / начАла
  - ноги        # 7   — нОги / ногИ
  - лица        # 6   — лИца / лицА
  - стены       # 5   — стЕны / стенЫ
  - волны       # 5   — вОлны / волнЫ
  - воды        # 2   — вОды / водЫ
  - поняла      # 2   — понялА
  - принял      # 2   — прИнял
  - приняли     # 1   — прИняли
  - начался     # 2   — началсЯ
  - обнять      # 2   — обнЯть
  - засыпать    # 1   — засыпАть / засЫпать
  - писать      # 1   — писАть
  - узнаю       # 1   — узнаЮ / узнАю
  - позвонить   # 1   — позвонИть
  - углубить    # 1   — углубИть
  - красивее    # 1   — красИвее
