rules:
  b5f9d711e19526d829dbbcc07f0690ac20c6a077:
    spoken: Самосохранение даёт страх.
  66f96e78ef5fe01fb764a1e0ea9a771c414b1942:
    spoken: Доминирование даёт статус и зависть.
  7025d7b1a05a4ee3d3e003e22aac0f0547a0b2b0:
    spoken: Агрессия даёт гнев и защиту.
  b1ddfdc4583d0498b890d3ce6b49ee5ef8a60728:
    spoken: Инстинкт еды даёт голод и деньги.
  df918f24d05bb049a35af01e0b34385c656eb978:
    spoken: Сексуальный инстинкт даёт влечение.
  08233eb39a64f0cb46963e733533ac729a515821:
    spoken: Размножение даёт привязанность.
  b9b2cc49f97398b6de832315a057d3fec5c02fef:
    spoken: Родительский инстинкт даёт заботу.
  1eebc68efb5cf2299eaa340ee2d3b8331fa37e44:
    spoken: Стадный инстинкт даёт принадлежность.
  dd00b24828f95f6cda5fd468a679a1c43c87a2b8:
    spoken: Познание даёт любопытство.
  f48ee73602b5115e5055953b09f9656f1a5e337c:
    spoken: 'Страх говорит: мне угрожают, это опасно.'
  e4d7fdcb81b6a45fa078030604a3420bcadca0b7:
    spoken: 'Злость говорит: меня обидели, это несправедливо.'
  24d5f7f5527d8558e217b1173e02cae157640cb5:
    spoken: 'Радость говорит: это хорошо, надо это удержать.'
  3ffef6e6a2df46d2c847c515e62d53fc5efc9983:
    spoken: Страх превращается в тревогу.
  729cc61ec13e8d305998c4cb7a79ab17ecb0c145:
    spoken: Злость превращается в обиду или вину.
  160206ca40bb0b6d5ddd94fa79f2e969b2137e1c:
    spoken: 'Радость превращается в тревогу: а вдруг это кончится?'
  20ff6601a65e3ca347291f7eeac4a86f30f04149:
    spoken: Инстинкт агрессии даёт эмоцию гнева.
  cde766e1770b0b193eec591a353b055347648288:
    spoken: Инстинкт самосохранения даёт эмоцию страха.
  6bd3d4d9d1496b8c17bcff990954ed6e64c6ff0b:
    spoken: Инстинкт размножения даёт радость от контакта и печаль от разлуки.
  f7bcc6e5be282c456d434cc048cae0aac65e96e5:
    spoken: Инстинкт познания даёт удивление и любопытство.
  5f0f4298d4d189307ebf90379e5e07ed27b1d23f:
    spoken: Инстинкт доминирования даёт гордость, а когда его место в иерархии нарушено
      — ярость.
  20ade93d6cacb4558b1972b1707dbfa966ba710a:
    spoken: Агрессия становится силой защищать границы и творчеством.
  93bf0f7e54c83c14196a500df77749053336456a:
    spoken: Самосохранение становится осознанной заботой о здоровье и безопасности.
  8392b6e1ea8b22b0caa83d0d7c548f99663bd24d:
    spoken: Размножение становится способностью к глубокой близости и осознанным выбором
      партнёра.
  3417b8e45348448d9cbb6cad7f50c5a1e6a7f0be:
    spoken: Познание становится исследованием, творчеством и мудростью.
  cea1ed71e41885209b3d6a4b0577129348d8aaa9:
    spoken: Доминирование становится здоровым лидерством и ответственностью.
  10c92abf522a225030b42d0302121376f7c8f738:
    spoken: Начальник не поздоровался — мозг кричит «змея!» — и вот паника.
  127f31d8b3b0e70b6da520b8a737527d2da0f819:
    spoken: Партнёр задержался на час — «змея!» — и вот ревность, гнев, страх.
  0fb7adc4fd06073ec3c6d2110e76da6d59b2e6ba:
    spoken: Кто-то посмотрел не так — «змея!» — и вот стыд и желание провалиться.
  4d9bbca6854104cfa1fb0a9b03b8f903a60dcfaa:
    spoken: 'Пять шагов: заметить, найти место, описать, побыть и сделать паузу.'
  d68f10858442848cdca17afd900775223efbd72f:
    spoken: 'Три колонки: ситуация, автоматическая мысль, эмоция и тело.'
  f918b76abaadedf27e86fc03a1a41e6f4dce27a6:
    spoken: 'Четыре шага: сформулировать убеждение, спланировать эксперимент, провести
      его и проанализировать.'
  f548e94a961c9658fc35b7fbf28c609e5fb6a5ba:
    spoken: 'Работа с Тенью: поймать проекцию, провести диалог с Тенью, завершить
      ритуалом принятия.'
  ba846ab65a1b4dc99187c297e0bbf36c48cead13:
    spoken: Вместо «терпи» — «я имею право защищать свои границы».
  7cadb4ef43ff6c98edb6080f7b1041d0df02a325:
    spoken: 'Беглец и Мазохист: он исчезает, она страдает и пытается спасти.'
  bc609dcd34ce7ccd6c7b08ba1b15e0c52ca5b4e6:
    spoken: 'От нуля до четырёх баллов — болевое тело спит. Профилактика: смотри главы
      шестнадцать и тридцать четыре.'
  e85d8255a87a3b7e8c7679a323ebbe9fe09fe3dd:
    spoken: От пяти до десяти — просыпается. Смотри главы двенадцать и шестнадцать.
  4238fab360fa656c985a6ec1e99b8e079179f615:
    spoken: Если большинство ответов «А» — тревожный тип, Зависимый. Смотри главу
      двадцать пять.
  6e52bafeeafbaade52709348e7bb9b1a0692610a:
    spoken: 'Если большинство ответов «Б» — избегающий тип: Беглец или Странник. Смотри
      главу двадцать пять.'
  82d7c8338cfd987b6c19329e614e45db990a201f:
    spoken: Беглец — в Сердечность.
  aeb9023d04247a733f6d98e8d28b75ec963b186f:
    spoken: Зависимый — в Силу.
  dcdc8e5008187184a3b5aafb98803f0f1933ccc5:
    spoken: Мазохист — в Принятие.
  acc2a7087c18992e93a775e284ffcf870ff6704f:
    spoken: Контролирующий — во Вдохновение.
  7c4c86406385b67b48ec05645d211e77bc7737d5:
    spoken: Железный человек — в Творчество.
  fb26920fe28dc4f0b04a7c2845ad1cf1930ae338:
    spoken: Странник — в Мудрость.
  60f47517a859050d7af613384d741642f3f1d64f:
    spoken: 'Три шага. Первый — «Я»: осознать себя. Второй — «Тебя»: перенести внимание
      в ощущение. Третий — «Чувствую»: включиться полностью.'
  bab5638bae4209b8947d74e9694b1924d4887cf5:
    spoken: '«Ты у нас мамина копия» — и ребёнок думает: я не могу быть собой. И потом
      всю жизнь играет чужую роль.'
  f96e1a35a7fd9ab46889651bf98c3a3384903b7b:
    spoken: '«Ты такой же бестолковый, как отец» — и ребёнок думает: я неудачник по
      рождению. И потом всю жизнь подтверждает это.'
  df56a75882840f7a70a71b67434207a20c577667:
    spoken: '«Ты наша опора и помощник» — и ребёнок думает: я должен заботиться обо
      всех. И потом всю жизнь тащит на себе чужие проблемы, забывая о себе.'
  a94d41c0c94862aa7d24044f9270072c129942d6:
    spoken: '«Ты всегда был болезненным» — и ребёнок думает: болеть — это моя роль.
      И потом всю жизнь болеет, чтобы получать внимание.'
  66f6f7011f65088558418a39c0c302a737e0aa04:
    spoken: '«Ты у нас трудный ребёнок» — и ребёнок думает: я плохой. И потом всю
      жизнь ведёт себя так, чтобы это подтверждать.'
  150c49655ae55d393ef577feb4edf581b6b1ba5b:
    spoken: Вместо «я должен быть идеальным» — «я имею право на ошибку, достаточно
      хорошо — это хорошо».
  5a6a33ca7cb7f5526663c38320d514d209be98d6:
    spoken: Вместо «не высовывайся» — «моё присутствие важно, я имею право быть».
  b5d858fde32657375c59083f747cafe08e0c4302:
    spoken: Вместо «ты никому не нужна» — «я нужна себе, и есть люди, которым я важна».
  649f4cf0d1ce9bb76813cee633811f2f03e44cd5:
    spoken: Вместо «будь удобной» — «я имею право быть неудобной, мои желания важны».
  50cf5d7ca1353726284be857ba153220a2e226d1:
    spoken: 'Инстинкт еды. Здоровое проявление: удовольствие от еды, насыщение. Искажение:
      заедание стресса, переедание, булимия.'
  2d1bab31386b2543d8b4db6e850e332ae0124f76:
    spoken: 'Инстинкт познания. Здоровое проявление: любопытство, исследование, обучение.
      Искажение: бесконечное листание ленты, зависимость от новостей и сериалов.'
  9278153c3102876ce65201b139ae454fffc20f5e:
    spoken: 'Сексуальный инстинкт. Здоровое проявление: близость, удовольствие. Искажение:
      порнозависимость, избыточный секс, секс как способ не чувствовать одиночество.'
  c2fbb8c0a92da5feedf5ff87e2180e5eb8e85fe2:
    spoken: 'Инстинкт агрессии. Здоровое проявление: защита границ, преодоление препятствий.
      Искажение: конфликтная зависимость, скандалы как способ выплеснуть напряжение.'
  dc4a3db643f40b3d34c81e4338512bfc40e98789:
    spoken: 'Инстинкт доминирования. Здоровое проявление: лидерство, ответственность,
      влияние. Искажение: властная зависимость, тотальный контроль, манипуляции.'
  47e04835fe2c937ef41307b6e7c8394b80790fbf:
    spoken: 'Стадный инстинкт. Здоровое проявление: принадлежность, общность, поддержка.
      Искажение: зависимость от групп, от чужого мнения, от лайков, от соцсетей.'
  bb417ae44587562fe057bcc244647e08f61eb8e1:
    spoken: 'Инстинкт самосохранения. Здоровое проявление: забота о себе, безопасность.
      Искажение: тревожная зависимость, постоянная проверка телефона, гиперопека,
      ипохондрия.'
  6e7503e95f376a98f9f0da7cad3a62d4cb2a7090:
    spoken: 'Инстинкт размножения. Здоровое проявление: глубокая связь, семья, привязанность.
      Искажение: любовная зависимость, созависимые отношения, страх одиночества.'
  ad69ba9f2cbcb28f7a2439beaa5f4936266a5e90:
    spoken: 'Родительский инстинкт. Здоровое проявление: забота о детях, воспитание.
      Искажение: спасательство, гиперопека, зависимость от «нужности».'
  068d7fd2b099bf53f9fbf8c302e0dc85d9bf51aa:
    spoken: 'Надёжный тип: доминирующей маски нет, есть опора на себя и на других.'
  99e750cafb476f9243e10da15e224b9faca650d0:
    spoken: 'Тревожный тип: маска Зависимого — страх быть брошенным, цепляние.'
  ebc80ac51d4f1a1aed133239813c5159eaea62e2:
    spoken: 'Избегающий тип: маски Беглеца и Странника — страх близости, уход.'
  4df75af11144fdf2065c57c6701db856db812b6e:
    spoken: 'Дезорганизованный тип: маски Контролирующего, Железного человека и Мазохиста
      — хаос и попытка управлять невыносимым.'
  dab44a28e7b41170dd01b431e1576567326fe17d:
    spoken: 'Беглец и Контролирующий: он убегает от её контроля, она усиливает контроль.'
  425708270a39009a3362129c89ccf47d69598944:
    spoken: 'Беглец и Железный человек: он идеален, она незаметна. Внешняя гармония,
      внутреннее одиночество.'
  db261d9672b47da68234b46f52974e9bfd6b8c7a:
    spoken: 'Беглец и Странник: два ухода — один в пустоту, другой в мысли. Тишина
      и отстранённость.'
  199a50be3a554203590a020dd63506f0704ec2e7:
    spoken: 'Зависимый и Зависимый: два тонущих хватаются друг за друга и тянут на
      дно.'
  1da13b5e38a5ed3b86b7681d524b12081f6aaad3:
    spoken: 'Зависимый и Мазохист: она цепляется, он страдает. Оба в ловушке вины
      и жалости.'
  bf594fd39d7ebfa839140b2b099e697dc271a372:
    spoken: 'Зависимый и Железный человек: он спасает, она цепляется. Он выгорает,
      она не взрослеет.'
  754e38611924cf7b6ed65b306006f0bb50c4459a:
    spoken: 'Зависимый и Странник: она хочет близости, он уходит в мысли. Она чувствует
      себя брошенной.'
  f9f75678412356c9726cf184fae4911dbcd6238d:
    spoken: 'Мазохист и Мазохист: конкурс жертв — кто больше страдает.'
  4d8879d97804c3baeca292344986d663f4137490:
    spoken: 'Мазохист и Железный человек: он спасает, она страдает. Никто не доволен.'
  457e47bb93d6e25ad98e74bf1ac941aeca141581:
    spoken: 'Мазохист и Странник: она страдает, он не замечает. Два одиночества.'
  8a4a57734205943f684b74a512e442d22b4d5af8:
    spoken: 'Контролирующий и Контролирующий: битва за власть, постоянные конфликты.'
  d9d39ec16e4d82e8f3302ded3cf2a4e51bb053f1:
    spoken: 'Контролирующий и Железный человек: борьба за главенство, оба выгорают.'
  a2e22dee9566d054bb66bb1e46b29b5ee903b4fc:
    spoken: 'Контролирующий и Странник: она контролирует, он уходит в мысли. Никто
      не получает своего.'
  4eb9e3c19cfb6386561bf02858cb07e84ace20de:
    spoken: 'Железный человек и Странник: она требует идеальности, он отстраняется.
      Она разочарована, он не понят.'
  2080c72dc23d50e22bace579c47de49e28f384b1:
    spoken: 'Странник и Странник: два философа в параллельных мирах. Холодно и пусто.'
  7c28b20b1dc775959744ed463a887db37fc87ba4:
    spoken: 'Беглец превращается в Сердечность. Талант: создавать безопасное пространство,
      слушать, утешать, быть рядом. Предназначение: делать мир теплее и человечнее.'
  e25dff7f3ee6638958e3f8fb79815fcbd5e73c6f:
    spoken: 'Зависимый превращается в Силу. Талант: быть опорой, защищать, вести за
      собой, держать удар. Предназначение: стоять там, где другие шатаются, и помогать
      другим обрести устойчивость.'
  54937ad112fdde9abc2af0051bc55cdc871bf0bf:
    spoken: 'Мазохист превращается в Принятие. Талант: принимать себя и других, исцелять
      через юмор и безусловную любовь. Предназначение: быть пространством, где можно
      быть любым, не боясь осуждения.'
  45534139f611751e0ec76b153af83f3ef428d476:
    spoken: 'Контролирующий превращается во Вдохновение. Талант: зажигать других,
      объединять, видеть ценность. Предназначение: создавать сообщества и движения,
      где каждый раскрывается.'
  96b38fae73d08c11f175ce10a66fd807fb7607be:
    spoken: 'Железный человек превращается в Творчество. Талант: создавать новое,
      доводить до качества, не боясь ошибок. Предназначение: приносить в мир красоту,
      инновации, смыслы.'
  1efd06b2c096556dc3037d8179c750834e2a0a68:
    spoken: 'Странник превращается в Мудрость. Талант: видеть глубинное, объяснять
      сложное, быть проводником. Предназначение: передавать знания, помогать другим
      видеть дальше.'
  67bfd61e234b2df2e6b0c73f57e84843b7c88d9b:
    spoken: От одиннадцати до восемнадцати — активно. Смотри главы двенадцать, тринадцать,
      четырнадцать, пятнадцать, шестнадцать и тридцать три; желательно с опорой на
      специалиста.
  e893ba45430db8ce5dc4df1709d3a97c55f5f574:
    spoken: 'Если большинство ответов «В» — дезорганизованный тип: Контролирующий,
      Железный человек или Мазохист. Смотри главу двадцать пять.'
  47ed6c0243566a1a2f973a293c901e194919a42a:
    spoken: «Не злись», «будь хорошим», «не нуждайся», «будь сильным», «не доверяй»,
      «не высовывайся».
  6eaf64229295aa398fd7fedc9dd596cdf3772ef3:
    spoken: Телесное напряжение, страх, стыд, злость, одиночество — и ощущение угрозы.
  5680f8ab2164ada7d617df012ed7736374302f1b:
    spoken: Событие. Тело реагирует. Появляется чувство. Включается знакомая мысль.
      И маска берёт управление.
  8260e2cdcd597373a60cdf09b61d033907c439d3:
    spoken: Замечает. Чувствует. Выдерживает. Отделяет прошлое от настоящего. Проверяет
      факты. Выбирает действие.
  100e0aee8b4896aab887e3b430858969e8ba7b37:
    spoken: Бессознательное, то есть инстинкты, даёт энергию. Подсознание с его запретами
      и программами эту энергию искажает. Сознание надевает маски — и энергия реализуется
      искажённо. Исцеление начинается там, где Взрослый снимает маску и освобождает
      энергию. Тогда появляется дар — энергия в чистом виде. А Мудрец наблюдает, но
      не вмешивается.
  5fae06f12fd1a51743bcba795377622363b2d197:
    spoken: Инстинкт рождает запрет, запрет создаёт внутренний конфликт, конфликт
      — защитную стратегию, а стратегия закрепляется как маска.
  9c24419675ad95f881bbaf6014e2ffc8c21d1ce1:
    spoken: 'Внешний стимул доходит до органов чувств. Дальше фильтр: опасно или нет.
      Затем сравнение с прошлым. Ум перебирает худшие сценарии, тело реагирует — страх,
      гнев, зажим — и остаётся блок в теле.'
  a45f5129ea4866c0b64d0a920722651d653c598c:
    spoken: 'Древо боли имеет видимую и невидимую часть. Видимая: плоды, листья, ветви,
      ствол. Невидимая: основание корня — рождение, дальше корень — перинатальный
      опыт, глубины рода и семя.'
  b9da3530d143e38886e2821e135295c6cc748a10:
    spoken: Инстинкты дают энергию. Родительские программы накладывают запреты. Ум-Подросток
      интерпретирует и искажает. Маска становится стратегией выживания. А болевое
      тело собирает зажимы и симптомы.
  852495c836d8b0c49ce806982f88dd14f44be8d2:
    spoken: Мысли рождают эмоции, эмоции — чувства, чувства — действия. Действия подтверждают
      мысли, и мысли становятся сильнее, эмоции глубже, а действия разрушительнее.
  0806546255bd6cef22a73d1c5786cf4f1f908f79:
    spoken: 'Его жизнь превращается в замкнутый круг: мысли, эмоции, чувства, действия
      — и всё это снова подтверждает мысли.'
  7e8400c4b3e97af72d8e75b34884097557dd4f39:
    spoken: Сначала триггер. Потом выбор. И только потом реакция.
  719c02cf5d6047a2f5af99c889bf590a583845a0:
    spoken: 'Алгоритм Взрослого: заметить ощущение, распознать — по душе или не по
      душе, назвать, понять, собрать информацию, оценить ресурсы, сделать вывод, принять
      решение, действовать и взять ответственность.'
  8cf7cf15df94c4d12ffb819c5779e8a8bb02151e:
    spoken: 'Инстинкт даёт энергию. Ребёнок проявляет её чисто. Приходит запрет: «нельзя».
      Энергия искажается и уходит в болевое тело. Подросток начинает компенсировать
      — так рождается зависимость. Взрослый осознаёт, энергия возвращается, и проявляется
      дар — то же самое, но здоровое.'
  b0b97d7d10b8f9838e824875a3478058d8ce93d5:
    spoken: Пять шагов — осознание, тело, мысли, поведение, отношения — плюс шестой,
      разгрузка нервной системы, ведут к свободе.
  4740127c8a40ae995dd5a903dffff0408893af47:
    spoken: 'Внизу, в подвале: что я имею сейчас — квартира, работа, семья, деньги.
      Выше — что я делаю: привычки, ежедневные действия. Ещё выше — как я это делаю:
      сценарии, маски, автоматизмы. Над этим — почему я так делаю: убеждения, родительские
      голоса. Дальше — кто я: мой дар, моя истинная суть. И на самом верху, на крыше:
      ради чего я здесь — предназначение, миссия, служение.'
  f990c10508108ed5899ad6825570364874c66621:
    spoken: 'Инстинкты дают естественную энергию и потребности. Родительские программы
      говорят: так нельзя, надо быть другим. Возникает внутренний конфликт, и Подросток
      ищет способ справиться. Маска становится защитной стратегией, а болевое тело
      хранит непрожитый опыт. Триггер запускает старый сценарий — но пауза создаёт
      пространство выбора, и Взрослый возвращает себе управление. Энергия освобождается,
      проявляется дар. И над всем этим — Мудрец.'
