# Pronunciation dictionary — stress/reading fixes for the TTS model.
#
# key = exact source string as it appears in the chunk (after normalization),
# value = respelling fed to the model instead. Whole-word match, longest first.
#
# Applied right before synthesis; it does NOT edit .norm.txt or the book.
# An entry that fires is part of the affected chunk's hash, so after editing
# this file run `./run.sh chunk` to re-queue the touched chunks (nothing else
# re-renders). Confirm every entry BY EAR — duration/whisper cannot verify stress.
#
# House rule for stress (confirmed by ear, see PROJECT.md §5.5). Two forms:
#   1. DEFAULT — SINGLE CAPITAL stressed vowel: "волну" -> "волнУ",
#      "Запить" -> "ЗапИть". Validated on end-of-word stress; use this whenever
#      the stressed vowel is not the word-initial letter of an already-capital
#      word.
#   2. EXCEPTION — word-initial stress on an ALREADY-CAPITALIZED word: DOUBLE the
#      stressed vowel, since a capital there is indistinguishable from ordinary
#      capitalization: "Отзывы" -> "Оотзывы".
# Rejected (all worse than baseline): the acute mark (U+0301) is ignored; the
# RUAccent "+" mark garbles output; hyphen, space or a capitalized whole
# syllable all hurt. The sentinel (config.model.sentinel) trims the drawn-out
# tail doubling adds (2.56s → 1.52s). Every entry must be confirmed by ear —
# duration/whisper cannot verify stress. Matching is case-sensitive and
# whole-word, so the key must carry the exact case as it appears in the text
# ("Запить" fires on the sentence-initial occurrence; a lowercase key would not).

"Отзывы": "Оотзывы"
"волну": "волнУ"       # accusative of "волна" (emotional-wave metaphor); all 24 book occurrences
"Запить": "ЗапИть"     # ch13 only, single occurrence, sentence-initial

# Group-1 stress fixes (ch13 diagnosis). Fixed-stress words, no stress heteronym,
# so a book-wide respelling is safe. Case-sensitive keys: both cases that occur.
"тебя": "тебЯ"              # gen/acc of "ты", always final stress; 366 book occ.
"Тебя": "ТебЯ"             # sentence-initial and quoted «Тебя»; 7 occ.
"себе": "себЕ"             # reflexive dat/prep, always final stress; 214 occ.
"твои": "твоИ"             # plural of "твой", stress on и; 55 occ.
"Твои": "ТвоИ"             # capitalized form; 21 occ.
"Вряд": "ВрЯд"             # "вряд ли", stress on я; only the capitalized form occurs
"выбивается": "выбивАется"  # third-syllable stress; 6 occ.
